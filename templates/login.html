<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 网络设备监控系统</title>
    <link href="/static/css/libs/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/libs/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-logo i {
            font-size: 4rem;
            color: #2563eb;
        }
        
        .login-logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-top: 1rem;
            margin-bottom: 0.25rem;
        }
        
        .login-logo p {
            color: #64748b;
            font-size: 0.875rem;
        }
        
        .form-floating {
            margin-bottom: 1rem;
        }
        
        .form-floating input {
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
        }
        
        .form-floating input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            border-radius: 0.5rem;
            padding: 0.875rem;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            margin-top: 1rem;
        }
        
        .btn-login:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        }
        
        .version-info {
            text-align: center;
            margin-top: 1.5rem;
            color: #94a3b8;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <i class="bi bi-hdd-network"></i>
            <h1>网络设备监控</h1>
            <p>Network Device Monitor</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ error }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('login') }}" autocomplete="off">
            <div class="form-floating">
                <input type="text" class="form-control" id="username" name="username" 
                       placeholder="用户名" required autofocus autocomplete="off">
                <label for="username"><i class="bi bi-person me-2"></i>用户名</label>
            </div>
            
            <div class="form-floating">
                <input type="password" class="form-control" id="password" name="password" 
                       placeholder="密码" required autocomplete="off">
                <label for="password"><i class="bi bi-lock me-2"></i>密码</label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>登录
            </button>
        </form>
        
        <div class="version-info">
            &copy; 2026 Network Monitor System
        </div>
    </div>
    
    <script src="/static/js/libs/bootstrap.bundle.min.js"></script>
</body>
</html>
